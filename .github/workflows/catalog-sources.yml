name: Catalog sources

# Re-downloads every pinned source in catalog/ (git trees, release assets, npm packages) and checks its hash
# (docs/CATALOG.md §4: hashes are computed by CI, not by hand). Not a required check: it needs network access to
# GitHub and npm. Runs when the catalog changes, weekly to catch upstream rewrites, and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - catalog/**
      - packages/sidecar/src/bootstrap/git-source.ts
      - packages/sidecar/scripts/verify-catalog-sources.ts
      - .github/workflows/catalog-sources.yml

permissions:
  contents: read

jobs:
  verify:
    name: Verify pinned catalog sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Verify every pinned source
        run: node packages/sidecar/scripts/verify-catalog-sources.ts
        env:
          # Read-only use of the GitHub API (release asset digests), to stay clear of anonymous rate limits.
          GITHUB_TOKEN: ${{ github.token }}
