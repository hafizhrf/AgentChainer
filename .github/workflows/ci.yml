name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (typecheck, fmt, clippy)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - name: Lint and format (Biome)
        run: pnpm lint
      - run: pnpm typecheck
      - name: Sidecar smoke (system.hello over stdio)
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"system.hello","params":{"protocolVersion":2}}' \
            | node packages/sidecar/src/main.ts | tee /dev/stderr | grep -q '"protocolVersion":2'
      - name: Unit tests with coverage (all packages)
        run: pnpm test:coverage
      - name: Build frontend (tauri::generate_context! embeds it)
        run: pnpm --filter @agentchainer/desktop build
      - name: Build sidecar executable (tauri-build requires bundle.externalBin)
        run: pnpm --filter @agentchainer/sidecar build:sea
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bootstrap:
    # Sidecar unit tests on every OS, then the M2 exit criteria E1/E3: on every fixture, the default bootstrap plus
    # every catalog item is applied (real downloads, a stand-in claude CLI) and rolled back byte for byte.
    name: Bootstrap exit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Sidecar unit tests
        run: pnpm --filter @agentchainer/sidecar test
      - name: Bootstrap and full rollback on every fixture (M2-E1, M2-E3)
        run: node --test packages/sidecar/src/bootstrap/exit.test.ts
        env:
          AC_EXIT_E2E: "1"

  build:
    name: Build & launch (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            binary: target/debug/agentchainer
          - name: Windows
            os: windows-latest
            binary: target/debug/agentchainer.exe
          - name: Ubuntu
            os: ubuntu-22.04
            binary: target/debug/agentchainer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb imagemagick
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - name: Build app (debug, no installer; beforeBuildCommand also builds the sidecar executable)
        run: pnpm --filter @agentchainer/desktop tauri build --debug --no-bundle
      - name: Packaged sidecar smoke (first-run SDK download + integrity check, then cache)
        run: node scripts/sidecar-smoke.mjs
      - name: Launch smoke test
        if: runner.os != 'Linux'
        run: node scripts/smoke-launch.mjs ${{ matrix.binary }} --screenshot screenshot-${{ matrix.name }}.png
      - name: Launch smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x900x24" node scripts/smoke-launch.mjs ${{ matrix.binary }} --screenshot screenshot-${{ matrix.name }}.png
      - name: Upload debug build and screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentchainer-debug-${{ matrix.name }}
          path: |
            ${{ matrix.binary }}
            screenshot-${{ matrix.name }}.png
          if-no-files-found: warn
          retention-days: 14
