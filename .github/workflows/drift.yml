name: Drift

# X-05: once a week, the newest Agent SDK (the newest pnpm accepts, release-age rule on) and the newest Claude Code
# CLI are checked against what the app relies on. Nothing is committed: adopting a new SDK stays a normal PR
# (packages/sidecar/scripts/pin-sdk.ts). A failure opens one issue, or comments on it; the next pass closes it.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Make one job fail, to see the issue path work"
        type: choice
        options: [none, sdk, cli]
        default: none

permissions:
  contents: read

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  sdk:
    name: Latest Agent SDK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Move the sidecar to the latest SDK
        id: bump
        run: |
          pnpm --filter @agentchainer/sidecar add -E @anthropic-ai/claude-agent-sdk@latest
          node packages/sidecar/scripts/pin-sdk.ts
          echo "version=$(node -p "require('./packages/sidecar/src/sdk-pin.json').version")" >> "$GITHUB_OUTPUT"
      - run: pnpm typecheck
      - name: Sidecar tests, with the recorded-fixture contract tests
        run: pnpm --filter @agentchainer/sidecar test
      - name: Simulated failure
        if: inputs.simulate == 'sdk'
        run: exit 1

  cli:
    name: Latest Claude Code CLI
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.install.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      # The CLI's own binary package for this platform, without install scripts (the repo keeps them off).
      - name: Install the latest CLI
        id: install
        run: |
          version=$(npm view @anthropic-ai/claude-code version)
          npm install --ignore-scripts --no-save --prefix "$RUNNER_TEMP/claude" "@anthropic-ai/claude-code-linux-x64@$version"
          echo "CLAUDE_BIN=$RUNNER_TEMP/claude/node_modules/@anthropic-ai/claude-code-linux-x64/claude" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the commands and flags the app runs
        run: node packages/sidecar/scripts/cli-contract.ts --claude "$CLAUDE_BIN"
      - name: Simulated failure
        if: inputs.simulate == 'cli'
        run: exit 1

  report:
    name: Open or close the drift issue
    needs: [sdk, cli]
    if: always() && github.repository == 'hafizhrf/AgentChainer'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SDK_RESULT: ${{ needs.sdk.result }}
          CLI_RESULT: ${{ needs.cli.result }}
          SDK_VERSION: ${{ needs.sdk.outputs.version }}
          CLI_VERSION: ${{ needs.cli.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Drift: the latest Agent SDK or Claude Code CLI breaks a contract"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          versions="Agent SDK ${SDK_VERSION:-unknown} ($SDK_RESULT), Claude Code CLI ${CLI_VERSION:-unknown} ($CLI_RESULT)"
          if [ "$SDK_RESULT" = success ] && [ "$CLI_RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "Passes again with $versions: $RUN_URL"
              gh issue close "$open"
            fi
            echo "No drift: $versions"
            exit 0
          fi
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "The weekly drift check (X-05) failed: $versions." \
            "Run: $RUN_URL" \
            "Reproduce: the \`sdk\` job bumps the SDK and runs \`pnpm typecheck\` and the sidecar tests; the \`cli\` job runs \`node packages/sidecar/scripts/cli-contract.ts\`. Fix the app or the contract, or hold the pin, then dispatch the Drift workflow again to close this.")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
