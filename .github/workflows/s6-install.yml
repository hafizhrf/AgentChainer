name: S6 plugin & MCP install

# Spike S6 (checklist M0-20) on all three OSes: installs and removes a plugin and MCP servers through the real
# Claude Code CLI, the way the bootstrap installer will (M2-14/15). It needs no Claude login. It isn't a required
# check; it runs when the installer code changes, or on demand.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - packages/sidecar/src/installer.ts
      - packages/sidecar/src/claude.ts
      - packages/sidecar/scripts/spike-install.ts
      - .github/workflows/s6-install.yml

permissions:
  contents: read

jobs:
  install:
    name: S6 install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Install Claude Code CLI (pinned to MIN_CLAUDE_VERSION, the oldest version AgentChainer supports)
        run: npm install -g @anthropic-ai/claude-code@2.1.293
      - run: claude --version
      - name: Add the official plugin marketplace (fresh runner)
        run: claude plugin marketplace add anthropics/claude-plugins-official
      - name: Plugin & MCP install spike
        run: node packages/sidecar/scripts/spike-install.ts --cwd "${{ runner.temp }}"
