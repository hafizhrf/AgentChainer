[package]
name = "agentchainer"
version = "0.1.0"
description = "AgentChainer desktop app (Tauri core)"
authors = ["hafizhrf"]
repository = "https://github.com/hafizhrf/AgentChainer"
license = "Apache-2.0"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "agentchainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# rusqlite 0.41.x, notify 8.2.1: younger than our two-week minimum release age.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
notify = "=8.2.0"
portable-pty = "=0.9.0"
