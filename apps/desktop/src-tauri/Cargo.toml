[package]
name = "agentchainer"
version = "0.1.0"
description = "AgentChainer desktop app (Tauri core)"
authors = ["hafizhrf"]
repository = "https://github.com/hafizhrf/AgentChainer"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "agentchainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
