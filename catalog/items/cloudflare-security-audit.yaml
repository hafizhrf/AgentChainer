# Seed item (docs/CATALOG.md §6). Offered once reviewed: see `reviews` and §4.
id: cloudflare-security-audit
name: "Security Audit (Cloudflare)"
kind: skill
tier: verified-vendor
license: "MIT"
homepage: https://github.com/cloudflare/security-audit-skill
summary: "Six-phase security audit that produces machine-readable findings."
why: >-
  Claude reviews your code like a security auditor and reports only problems it can back with evidence, each with
  steps to check it, instead of generic advice. A full audit is thorough, slow and uses many model calls, so run it
  on demand (for example before a release), not on every change.
source:
  type: git
  repo: https://github.com/cloudflare/security-audit-skill
  ref: "c1c8a8c1471069fb0e188eeaff69b8e8db6564a8"
  path: skills/security-audit
  sha256: "5db66b10cb1d1120eded16e443dd47ba8a54dfc40432afe9eb94a21b13351899"
platforms: [darwin, linux, win32]
requires:
  - tool: node
    hint: "Install Node.js 18 or later"
risk: medium
permissions:
  - "In a full audit, spawns many subagents (4 to map the code, then hunters, reviewers and verifiers), which uses a lot of model usage"
  - "Writes its reports outside the project, by default in ~/security-audit-skill/<repo>/run-<N>"
  - "Runs the project's build and tests only inside an OS sandbox without network; without one it only reads code"
  - "Runs node to check its own report files (the validators use only the file system)"
install:
  scope: project
  steps:
    - copy: { from: ".", to: ".claude/skills/security-audit" }
uninstall:
  steps:
    - remove: ".claude/skills/security-audit"
