# Seed item (docs/CATALOG.md §6). Offered once reviewed: see `reviews` and §4.
id: commit-commands
name: "Commit Commands"
kind: plugin
tier: official
license: "Apache-2.0"
summary: "Commands for committing, pushing and opening pull requests."
why: >-
  Turns the usual git routine into one command: Claude writes the commit message, pushes and can open the pull
  request.
source:
  type: marketplace
  marketplace: claude-plugins-official
  repo: anthropics/claude-plugins-official
  plugin: commit-commands
  reviewedVersion: "1.0.1"
  reviewedRef: "f8c5e7a1dcb71b10cb74586224b5401f3de5db28"
platforms: [darwin, linux, win32]
requires:
  - tool: git
    hint: "Install Git (https://git-scm.com)"
risk: medium
permissions:
  - "Adds /commit, /commit-push-pr and /clean_gone commands"
  - "/commit stages and commits your changes; the git commands it needs run without asking"
  - "/commit-push-pr also pushes the branch to origin and opens a GitHub pull request with your gh login, without asking"
  - "/clean_gone deletes local branches whose remote branch is gone (git branch -D) and force-removes their worktrees, which can drop unpushed or uncommitted work"
install:
  scope: project
  steps:
    - run: [claude, plugin, install, "commit-commands@claude-plugins-official", --scope, project, --json]
uninstall:
  steps:
    - run: [claude, plugin, uninstall, "commit-commands@claude-plugins-official", --scope, project, --json]
reviews:
  - by: hafizhrf
    date: "2026-10-30"
    ref: "f8c5e7a1dcb71b10cb74586224b5401f3de5db28"
    notes: >-
      Read the 3 commands, plugin.json, README and LICENSE at f8c5e7a (1.0.1): Apache-2.0; no hooks, MCP servers or
      telemetry. Pre-approves git add/commit/push and gh pr create; /clean_gone uses branch -D and worktree remove
      --force. docs/catalog-reviews/2026-10-30.md
notes: >-
  /commit-push-pr needs the GitHub CLI (gh), installed and signed in. The plugin doesn't scan for secrets; the
  gitleaks hook covers that.
i18n:
  id:
    name: "Commit Commands"
    summary: "Perintah untuk commit, push, dan membuka pull request."
    why: >-
      Mengubah rutinitas git yang biasa menjadi satu perintah: Claude menulis pesan commit, melakukan push, dan dapat
      membuka pull request.
    permissions:
      - "Menambahkan perintah /commit, /commit-push-pr, dan /clean_gone"
      - >-
        /commit melakukan stage dan commit atas perubahan Anda; perintah git yang dibutuhkannya berjalan tanpa
        bertanya
      - >-
        /commit-push-pr juga melakukan push branch ke origin dan membuka pull request GitHub dengan login gh Anda,
        tanpa bertanya
      - >-
        /clean_gone menghapus branch lokal yang branch remote-nya sudah tidak ada (git branch -D) dan menghapus paksa
        worktree-nya, yang dapat membuang pekerjaan yang belum di-push atau belum di-commit
    notes: >-
      /commit-push-pr membutuhkan GitHub CLI (gh), terpasang dan sudah login. Plugin ini tidak memindai secret; hook
      gitleaks yang menanganinya.
    hints:
      git: "Pasang Git (https://git-scm.com)"
