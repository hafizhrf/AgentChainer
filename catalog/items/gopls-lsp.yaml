# Seed item (docs/CATALOG.md §6). Offered once reviewed: see `reviews` and §4.
id: gopls-lsp
name: "Go language server (gopls)"
kind: plugin
tier: official
license: "Apache-2.0"
summary: "Gives Claude Go code intelligence and refactoring through gopls."
why: >-
  Claude can navigate Go packages and see compiler errors as it edits.
source:
  type: marketplace
  marketplace: claude-plugins-official
  repo: anthropics/claude-plugins-official
  plugin: gopls-lsp
  reviewedVersion: "1.0.0"
  reviewedRef: "f8c5e7a1dcb71b10cb74586224b5401f3de5db28"
platforms: [darwin, linux, win32]
requires:
  - tool: gopls
    hint: "go install golang.org/x/tools/gopls@latest, then add $(go env GOPATH)/bin to your PATH"
risk: low
permissions:
  - "Starts gopls in the project"
install:
  scope: project
  steps:
    - run: [claude, plugin, install, "gopls-lsp@claude-plugins-official", --scope, project, --json]
uninstall:
  steps:
    - run: [claude, plugin, uninstall, "gopls-lsp@claude-plugins-official", --scope, project, --json]
reviews:
  - by: hafizhrf
    date: "2026-10-30"
    ref: "f8c5e7a1dcb71b10cb74586224b5401f3de5db28"
    notes: >-
      Read the marketplace entry, README and LICENSE at f8c5e7a (1.0.0, the whole folder): Apache-2.0; a config-only
      LSP plugin that starts gopls from PATH; no hooks, MCP servers, scripts or telemetry. gopls may download the
      modules go.mod lists. docs/catalog-reviews/2026-10-30.md
