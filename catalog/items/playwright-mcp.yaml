# Seed item (docs/CATALOG.md §6). Offered once reviewed: see `reviews` and §4.
id: playwright-mcp
name: "Playwright browser (MCP, pinned)"
kind: mcp
tier: verified-vendor
license: Apache-2.0
homepage: https://github.com/microsoft/playwright-mcp
summary: "Microsoft's Playwright MCP server: Claude drives a real browser to check web UIs."
why: >-
  Claude can open your app in a browser, click through it and read what's on the page, so UI changes are checked
  the way a person would check them.
source:
  type: npm
  name: "@playwright/mcp"
  version: "0.0.83"
  integrity: "sha512-oNcl+Ae2/IAjhfPeP46BfIkSakfmprY+aOtkv5MjrQ4lPav4/yNtPhL0iq8SlIM90oApWgBDUxaNKvktazUKOg=="
platforms: [darwin, linux, win32]
risk: high
permissions:
  - "Starts your installed Google Chrome and visits the pages Claude chooses"
  - "Runs npx, which downloads the pinned @playwright/mcp and two Playwright packages from npm on first use"
  - "Has a tool that runs any JavaScript on your computer (browser_run_code_unsafe); Claude Code asks before each use unless you allow it"
  - "Starts each session with a fresh browser profile (--isolated): no cookies or logins are kept"
install:
  # Portable (npx with an exact version), so it can be shared in the project's .mcp.json.
  scope: project
  steps:
    - merge-json:
        path: .mcp.json
        value:
          mcpServers:
            playwright:
              command: npx
              args: ["-y", "@playwright/mcp@0.0.83", "--isolated"]
reviews:
  - by: hafizhrf
    date: "2026-10-30"
    ref: "0.0.83"
    notes: >-
      The 0.0.83 tarball's sha512 matches the pin and the registry, published with npm provenance. Read package.json,
      cli.js, index.js, README and LICENSE (Apache-2.0); dependencies are exact Playwright versions with no install
      scripts; no telemetry. Uses the system Chrome; browser_run_code_unsafe is on by default. docs/catalog-reviews/2026-10-30.md
notes: >-
  Pinned to an exact version, unlike the playwright plugin, which runs @playwright/mcp@latest. Claude Code asks
  before using servers from a project's .mcp.json. Needs Google Chrome (or run npx @playwright/mcp@0.0.83
  install-browser chrome) and a display.
i18n:
  id:
    name: "Browser Playwright (MCP, di-pin)"
    summary: "MCP server Playwright dari Microsoft: Claude mengendalikan browser sungguhan untuk memeriksa web UI."
    why: >-
      Claude dapat membuka aplikasi Anda di browser, mengklik di dalamnya, dan membaca isi halaman, sehingga perubahan
      UI diperiksa seperti cara seseorang memeriksanya.
    permissions:
      - "Menjalankan Google Chrome yang terpasang dan mengunjungi halaman yang dipilih Claude"
      - >-
        Menjalankan npx, yang mengunduh @playwright/mcp versi yang di-pin dan dua paket Playwright dari npm pada
        pemakaian pertama
      - >-
        Memiliki tool yang menjalankan JavaScript apa pun di komputer Anda (browser_run_code_unsafe); Claude Code
        bertanya sebelum setiap pemakaian kecuali Anda mengizinkannya
      - "Memulai setiap session dengan profil browser baru (--isolated): tidak ada cookie atau login yang disimpan"
    notes: >-
      Di-pin ke versi yang pasti, tidak seperti plugin playwright yang menjalankan @playwright/mcp@latest. Claude Code
      bertanya sebelum memakai server dari .mcp.json milik proyek. Membutuhkan Google Chrome (atau jalankan npx
      @playwright/mcp@0.0.83 install-browser chrome) dan layar.
