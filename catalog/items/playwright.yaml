# Seed item (docs/CATALOG.md §6). Offered once reviewed: see `reviews` and §4.
id: playwright
name: "Playwright browser (Microsoft)"
kind: plugin
tier: verified-vendor
license: "Apache-2.0"
homepage: https://github.com/microsoft/playwright-mcp
summary: "Lets Claude drive a real browser: open pages, click, fill forms and take screenshots."
why: >-
  Claude can check a web UI end to end, the way a tester would, instead of only reading the code.
source:
  type: marketplace
  marketplace: claude-plugins-official
  repo: anthropics/claude-plugins-official
  plugin: playwright
  reviewedRef: "f8c5e7a1dcb71b10cb74586224b5401f3de5db28"
platforms: [darwin, linux, win32]
requires:
  - tool: npx
    hint: "Install Node.js (npx comes with it)"
risk: high
permissions:
  - "Starts your installed Google Chrome, which Claude controls; it can open any URL"
  - "Runs npx @playwright/mcp@latest on every start: whatever version is newest at that moment, not a reviewed one"
  - "Has a tool that runs any JavaScript on your computer (browser_run_code_unsafe)"
  - "Keeps the browser's cookies and logins between sessions"
install:
  scope: project
  steps:
    - run: [claude, plugin, install, "playwright@claude-plugins-official", --scope, project, --json]
uninstall:
  steps:
    - run: [claude, plugin, uninstall, "playwright@claude-plugins-official", --scope, project, --json]
reviews: []
notes: >-
  Not approved (docs/catalog-reviews/2026-10-30.md): the plugin runs `npx @playwright/mcp@latest`, a floating tag,
  which ADR-0005 rules out. Use playwright-mcp, the same server pinned to a reviewed version.
