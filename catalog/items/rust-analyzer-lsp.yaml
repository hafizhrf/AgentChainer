# Seed item (docs/CATALOG.md §6). Offered once reviewed: see `reviews` and §4.
id: rust-analyzer-lsp
name: "Rust language server (rust-analyzer)"
kind: plugin
tier: official
license: "Apache-2.0"
summary: "Gives Claude Rust code intelligence through rust-analyzer."
why: >-
  Claude sees Rust type and borrow errors and definitions as it edits.
source:
  type: marketplace
  marketplace: claude-plugins-official
  repo: anthropics/claude-plugins-official
  plugin: rust-analyzer-lsp
  reviewedVersion: "1.0.0"
  reviewedRef: "f8c5e7a1dcb71b10cb74586224b5401f3de5db28"
platforms: [darwin, linux, win32]
requires:
  - tool: rust-analyzer
    hint: "rustup component add rust-analyzer"
risk: low
permissions:
  - "Starts rust-analyzer in the project; it runs cargo, which can build and run the project's build scripts and macros and download crates"
install:
  scope: project
  steps:
    - run: [claude, plugin, install, "rust-analyzer-lsp@claude-plugins-official", --scope, project, --json]
uninstall:
  steps:
    - run: [claude, plugin, uninstall, "rust-analyzer-lsp@claude-plugins-official", --scope, project, --json]
reviews:
  - by: hafizhrf
    date: "2026-10-30"
    ref: "f8c5e7a1dcb71b10cb74586224b5401f3de5db28"
    notes: >-
      Read the marketplace entry, README and LICENSE at f8c5e7a (1.0.0, the whole folder): Apache-2.0; a config-only
      LSP plugin that starts rust-analyzer from PATH; no hooks, MCP servers, scripts or telemetry. The server runs
      cargo build scripts and proc macros, as any Rust editor does. docs/catalog-reviews/2026-10-30.md
