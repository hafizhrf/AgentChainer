# Seed item (docs/CATALOG.md §6). Offered once reviewed: see `reviews` and §4.
id: security-guidance
name: "Security Guidance"
kind: plugin
tier: official
license: "Apache-2.0"
summary: "Flags insecure patterns in Claude's edits and reviews the diff for vulnerabilities."
why: >-
  Catches injection, XSS, SSRF, hardcoded secrets and similar mistakes while Claude writes the code, not after
  it ships.
source:
  type: marketplace
  marketplace: claude-plugins-official
  repo: anthropics/claude-plugins-official
  plugin: security-guidance
  reviewedVersion: "2.0.17"
  reviewedRef: "f8c5e7a1dcb71b10cb74586224b5401f3de5db28"
platforms: [darwin, linux, win32]
requires:
  - tool: python3
    hint: "Python 3.10 or newer (macOS's built-in 3.9 runs only the pattern warnings)"
risk: high
permissions:
  - "Checks every file Claude edits for risky code patterns and warns Claude (local, no network)"
  - "After each turn, sends the changed code to Claude Opus for a security review that isn't shown in your session's cost (uses your Claude plan or API key)"
  - "After git commit or push, a background reviewer reads related project files and sends them to the model"
  - "Can wake Claude after it finishes so it fixes the findings"
  - "On first use, installs the latest claude-agent-sdk from PyPI (a few hundred MB, not pinned) into ~/.claude/security"
  - "Keeps a log and state in ~/.claude/security, which uninstall doesn't remove"
  - "Reports usage counts to Anthropic through Claude Code's hook metrics"
install:
  scope: project
  steps:
    - run: [claude, plugin, install, "security-guidance@claude-plugins-official", --scope, project, --json]
uninstall:
  steps:
    - run: [claude, plugin, uninstall, "security-guidance@claude-plugins-official", --scope, project, --json]
reviews: []
notes: >-
  Not approved at f8c5e7a (docs/catalog-reviews/2026-10-30.md): its hooks pip-install an unpinned claude-agent-sdk at
  runtime, which ADR-0005 rules out, and its model reviews spend outside the session's visible cost. It's no longer
  in the baseline profile. If you use it anyway: ENABLE_CODE_SECURITY_REVIEW=0 turns off the model reviews and the
  SDK install; SECURITY_GUIDANCE_DISABLE=1 turns the plugin off.
i18n:
  id:
    name: "Security Guidance"
    summary: "Menandai pola yang tidak aman di edit Claude dan meninjau diff untuk kerentanan."
    why: >-
      Menangkap injection, XSS, SSRF, secret yang ditulis langsung di kode, dan kesalahan serupa saat Claude menulis
      kode, bukan setelah dirilis.
    permissions:
      - >-
        Memeriksa setiap file yang diedit Claude untuk pola kode berisiko dan memperingatkan Claude (lokal, tanpa
        jaringan)
      - >-
        Setelah setiap giliran, mengirim kode yang berubah ke Claude Opus untuk review keamanan yang tidak tampil di
        biaya session Anda (memakai paket Claude atau API key Anda)
      - >-
        Setelah git commit atau push, peninjau di latar belakang membaca file proyek yang terkait dan mengirimkannya
        ke model
      - "Dapat membangunkan Claude setelah ia selesai agar ia memperbaiki temuannya"
      - >-
        Pada pemakaian pertama, memasang claude-agent-sdk terbaru dari PyPI (beberapa ratus MB, tidak di-pin) ke
        ~/.claude/security
      - "Menyimpan log dan state di ~/.claude/security, yang tidak dihapus saat uninstall"
      - "Melaporkan jumlah pemakaian ke Anthropic lewat metrik hook Claude Code"
    notes: >-
      Tidak disetujui di f8c5e7a (docs/catalog-reviews/2026-10-30.md): hook-nya memasang claude-agent-sdk yang tidak
      di-pin lewat pip saat runtime, yang dilarang ADR-0005, dan review modelnya memakai biaya di luar biaya session
      yang terlihat. Ia tidak lagi ada di profil baseline. Jika Anda tetap memakainya: ENABLE_CODE_SECURITY_REVIEW=0
      mematikan review model dan instalasi SDK; SECURITY_GUIDANCE_DISABLE=1 mematikan plugin ini.
    hints:
      python3: "Python 3.10 atau lebih baru (Python 3.9 bawaan macOS hanya menjalankan peringatan pola)"
