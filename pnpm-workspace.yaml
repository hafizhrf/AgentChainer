packages:
  - apps/*
  - packages/*

# Install scripts stay off. esbuild's postinstall only re-links the binary that its
# platform package (@esbuild/<os>-<arch>) already provides.
allowBuilds:
  esbuild: false

# Shared versions; packages reference them as "catalog:".
catalog:
  typescript: ~7.0.2
  "@types/node": ^26.6.5

# The Agent SDK ships a bundled Claude binary per platform. We use the user's own
# installed `claude` instead (ADR-0002), so skip those packages.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-*"
